plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

description = 'Spider Sense: OTLP receiver, H2-backed store, JSON API and static UI'

ext {
    // The protobuf runtime opentelemetry-proto is generated against; protobuf-java-util
    // must match it exactly or JsonFormat and the generated classes disagree at runtime.
    protobufVersion = '4.35.1'
}

dependencies {
    implementation "net.benelog.spidersilk:spider-silk-core:${rootProject.ext.spiderSilkVersion}"
    implementation "io.opentelemetry.proto:opentelemetry-proto:${rootProject.ext.otelProtoVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    implementation "com.h2database:h2:${rootProject.ext.h2Version}"
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation "net.benelog.spidersilk:spider-silk-test:${rootProject.ext.spiderSilkVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'net.benelog.spidersense.server.SpiderSenseServer'
}

// The agent skills ride inside the jar so that `init` can copy them into a project's
// .claude/skills/ on a machine that has no checkout of this repository (agent-skill.adoc#skill-copy).
// Every directory under skills/ travels, so a new skill is a new directory and nothing
// else. The repository's skills/ stays the single source: nothing is duplicated under
// src/main/resources. A class loader cannot list a directory, so the build writes an
// index of the paths relative to skills/ beside the files.
def skillSource = rootProject.layout.projectDirectory.dir('skills')

def skillIndex = tasks.register('skillIndex') {
    group = 'build'
    description = 'Writes the index of the skill files packaged into the jar'
    def from = skillSource.asFile
    def into = layout.buildDirectory.file('generated/skills/index.txt')
    inputs.dir(from).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(into)
    doLast {
        def root = from.toPath()
        def names = []
        from.eachFileRecurse(groovy.io.FileType.FILES) {
            names << root.relativize(it.toPath()).toString().replace('\\', '/')
        }
        def file = into.get().asFile
        file.parentFile.mkdirs()
        file.text = names.sort().join('\n') + '\n'
    }
}

// The version stamp Version reads when the classes have no manifest (tests, an IDE); the jars
// carry the same value as Implementation-Version.
def generateVersionProperties = tasks.register('generateVersionProperties', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/version/version.properties')
    property 'version', project.version.toString()
    comment = 'Generated by :spider-sense-server:generateVersionProperties'
}

processResources {
    from(generateVersionProperties) {
        into 'net/benelog/spidersense/server'
    }
    from(skillSource) {
        into 'spider-sense/skills'
    }
    from(skillIndex) {
        into 'spider-sense/skills'
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'Spider Sense server',
                'Implementation-Version': project.version.toString()
    }
}

shadowJar {
    archiveClassifier = 'all'
    // INCLUDE so mergeServiceFiles actually sees every META-INF/services entry;
    // the default EXCLUDE drops duplicates before the transformer runs.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    // Signatures of shaded dependencies do not survive being repacked.
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'Spider Sense server',
                'Implementation-Version': project.version.toString()
    }
}

// The agent module nests this fat jar inside the distributable jar; it consumes it
// as project(path: ':spider-sense-server', configuration: 'serverJar').
configurations.create('serverJar') {
    canBeConsumed = true
    canBeResolved = false
}

artifacts {
    serverJar(tasks.shadowJar)
}

test {
    // Quiet by default; -PsenseLogLevel=info -PsenseVerbose=true when a handler's
    // stack trace is what a failing test is actually about.
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel',
            project.findProperty('senseLogLevel') ?: 'warn'
    testLogging.showStandardStreams = Boolean.valueOf(project.findProperty('senseVerbose') ?: 'false')
}
