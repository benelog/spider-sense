<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Spider Sense">
  <title>Spider Sense</title>
  <!-- Eight continuous spokes and four closed rings fill the web to its hub. -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 10V190 M10 100H190 M34 34L166 166 M166 34L34 166"/>
    <path d="M100 80 Q106.1 85.3 114.1 85.9 Q114.7 93.9 120 100 Q114.7 106.1 114.1 114.1 Q106.1 114.7 100 120 Q93.9 114.7 85.9 114.1 Q85.3 106.1 80 100 Q85.3 93.9 85.9 85.9 Q93.9 85.3 100 80Z"/>
    <path d="M100 60 Q112.2 70.6 128.3 71.7 Q129.4 87.8 140 100 Q129.4 112.2 128.3 128.3 Q112.2 129.4 100 140 Q87.8 129.4 71.7 128.3 Q70.6 112.2 60 100 Q70.6 87.8 71.7 71.7 Q87.8 70.6 100 60Z"/>
    <path d="M100 38 Q118.9 54.5 143.8 56.2 Q145.5 81.1 162 100 Q145.5 118.9 143.8 143.8 Q118.9 145.5 100 162 Q81.1 145.5 56.2 143.8 Q54.5 118.9 38 100 Q54.5 81.1 56.2 56.2 Q81.1 54.5 100 38Z"/>
    <path d="M100 16 Q125.5 38.3 159.4 40.6 Q161.7 74.5 184 100 Q161.7 125.5 159.4 159.4 Q125.5 161.7 100 184 Q74.5 161.7 40.6 159.4 Q38.3 125.5 16 100 Q38.3 74.5 40.6 40.6 Q74.5 38.3 100 16Z" stroke-width="3"/>
  </g>
  <!-- A bold, eight-legged silhouette with room between each leg. -->
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 103L80 96L78 84 M89 110L72 106L66 95 M89 117L73 123L68 136 M92 124L84 131L84 140"/>
    <path d="M108 103L120 96L122 84 M111 110L128 106L134 95 M111 117L127 123L132 136 M108 124L116 131L116 140"/>
  </g>
  <g fill="currentColor">
    <circle cx="100" cy="96" r="8"/>
    <ellipse cx="100" cy="117" rx="13" ry="18"/>
  </g>
  <!-- The tingle overlays the intact north-east quarter of the web. -->
  <g class="sense-arcs" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round">
    <path d="M100 50A22 22 0 0 1 122 72"/>
    <path d="M100 32A40 40 0 0 1 140 72"/>
    <path d="M100 14A58 58 0 0 1 158 72"/>
  </g>
  <!-- Keep the anomaly anchored to the outer ring / radial intersection as the arcs pulse. -->
  <circle class="anomaly" cx="159.4" cy="40.6" r="5" fill="currentColor"/>
</svg>
