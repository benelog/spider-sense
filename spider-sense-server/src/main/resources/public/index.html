    <a class="brand" href="#/" aria-label="Spider Sense, overview">
      <svg class="brand-mark" width="64" height="64" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <!-- Eight continuous spokes and four closed rings fill the web to its hub. -->
        <g fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M100 10V190 M10 100H190 M34 34L166 166 M166 34L34 166"/>
          <path d="M100 80 Q106.1 85.3 114.1 85.9 Q114.7 93.9 120 100 Q114.7 106.1 114.1 114.1 Q106.1 114.7 100 120 Q93.9 114.7 85.9 114.1 Q85.3 106.1 80 100 Q85.3 93.9 85.9 85.9 Q93.9 85.3 100 80Z"/>

          <path d="M92 103L80 96L78 84 M89 110L72 106L66 95 M89 117L73 123L68 136 M92 124L84 131L84 140"/>
          <path d="M108 103L120 96L122 84 M111 110L128 106L134 95 M111 117L127 123L132 136 M108 124L116 131L116 140"/>
        </g>
        <g fill="currentColor">
          <circle cx="100" cy="96" r="8"/>
          <ellipse cx="100" cy="117" rx="13" ry="18"/>
        </g>
        <!-- The tingle overlays the intact north-east quarter of the web. -->

          <path d="M100 50A22 22 0 0 1 122 72"/>
          <path d="M100 32A40 40 0 0 1 140 72"/>
          <path d="M100 14A58 58 0 0 1 158 72"/>

      <span class="brand-name">Spider<br>Sense</span>
