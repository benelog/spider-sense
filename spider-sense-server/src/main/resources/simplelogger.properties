# Spider Silk, Jetty and H2 log through slf4j-simple, which talks at info level by
# default. A collector living inside someone else's application must be quiet
# unless its user asked otherwise (-Dorg.slf4j.simpleLogger.defaultLogLevel=info
# wins over this file). A file rather than a system property: in agent mode the
# server's class loader is the only one that sees it, so the monitored
# application's own slf4j-simple keeps its level.
org.slf4j.simpleLogger.defaultLogLevel=warn
