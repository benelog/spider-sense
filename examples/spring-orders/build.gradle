// The Spring Boot Gradle plugin is applied through buildscript rather than the plugins {} block
// so that the version comes from the root build.gradle ext block (springBootVersion) like every other version.
buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${rootProject.ext.springBootVersion}"
    }
}

// The Spider Sense plugin comes from the included build in settings.gradle, so
// it needs no version here. A plugins {} block may follow buildscript {} and
// must come before the apply plugin: lines.
plugins {
    id 'net.benelog.spidersense'
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'

// Boot 4's Gradle plugin does not apply dependency management by itself.
// Gradle's own platform() support is used instead of io.spring.dependency-management (faster, one less plugin).
dependencies {
    // The jar this build just made, not one from Maven Central: bootRun waits
    // for :spider-sense-agent:senseJar and attaches its output.
    spiderSense project(path: ':spider-sense-agent', configuration: 'senseJar')

    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Boot 4 renamed spring-boot-starter-web to spring-boot-starter-webmvc and split the blocking
    // HTTP clients (RestClient/RestTemplate) out into spring-boot-starter-restclient.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly "com.h2database:h2:${rootProject.ext.h2Version}"

    testImplementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The port scripts/demo.sh gives this application; silk-bookstore has 4000.
spiderSense {
    port = 4001
}

// Actuator's metrics are Micrometer meters; the OpenTelemetry agent bridges the
// global registry to OTLP only when asked, so the demo asks. The scripts under
// scripts/ pass the same property on the command line (gradle-plugin.adoc).
tasks.named('bootRun') {
    jvmArgs '-Dotel.instrumentation.micrometer.enabled=true'
}

tasks.named('bootJar') {
    archiveFileName = "spring-orders-${project.version}.jar"
}

tasks.named('test') {
    // The seeded data set is tiny in tests; keep the whole run well under 20 s.
    maxHeapSize = '1g'
}
