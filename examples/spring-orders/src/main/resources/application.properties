# The OpenTelemetry agent's Spring Boot resource detector reads spring.application.name
# when otel.service.name is not set, so the service is named even without -Dotel.service.name.
spring.application.name=spring-orders

server.port=8082

spring.datasource.url=jdbc:h2:~/db/spider-sense/orders;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# The SQL is meant to be read in the trace, not in the console.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Seed sizes; the tests shrink these.
orders.seed.customers=500
orders.seed.products=200
orders.seed.orders=50000

# silk-bookstore, for GET /api/orders/{id}/enriched. Optional: when it is down, "book" is null.
orders.bookstore.base-url=http://localhost:8081

# Let the flaky endpoint's stack trace reach the client so the failure is obvious.
server.error.include-message=always
