plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'loadgen.LoadGen'
}

// No runtime dependencies at all: java.net.http is enough, and the OpenTelemetry agent
// instruments it, so traffic from this program starts its own traces.
dependencies {
    testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
