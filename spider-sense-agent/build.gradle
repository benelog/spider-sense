plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

description = 'Spider Sense: the launcher (premain/main) and the single distributable jar'

configurations {
    // The stock OpenTelemetry Java agent, unpacked verbatim into the distributable jar.
    otelAgent {
        transitive = false
        canBeConsumed = false
    }
    // The collector + UI fat jar, nested at spider-sense/server.jar.
    server {
        canBeConsumed = false
    }
    // The OpenTelemetry agent extension, on its own: it is compiled against the SDK but ships
    // none of it, because the agent's ExtensionClassLoader supplies the shaded classes.
    extension {
        transitive = false
        canBeConsumed = false
    }
    // What SampleApp needs beyond the test classes when SingleJarIT runs it in a JVM of its own.
    sampleApp {
        canBeConsumed = false
    }
    // The single distributable jar, for another project in this build to consume:
    //   spiderSense project(path: ':spider-sense-agent', configuration: 'senseJar')
    // is how the examples attach the jar this build just made instead of one from
    // Maven Central (docs/build-tools.md).
    senseJar {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${rootProject.ext.otelAgentVersion}"
    server project(path: ':spider-sense-server', configuration: 'serverJar')
    extension project(':spider-sense-extension')

    sampleApp "com.h2database:h2:${rootProject.ext.h2Version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
    testImplementation "com.h2database:h2:${rootProject.ext.h2Version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The launcher must stay dependency-free: everything it needs is in java.base, and the
// whole top level of the distributable jar ends up on the bootstrap class path.
tasks.named('compileJava') {
    // The class path is read into a provider here, while the build file is
    // read: a closure that asked `configurations` when the task runs would
    // reach back into this script, which the configuration cache cannot store.
    def compileClasspath = configurations.compileClasspath.elements
    doFirst {
        def dependencies = compileClasspath.get()
        if (!dependencies.isEmpty()) {
            throw new GradleException('The launcher must have no compile dependencies: ' +
                    dependencies.collect { it.asFile })
        }
    }
}

// Version stamp read by NestedJar when the manifest is unavailable (exploded classes in an IDE).
def generateVersionProperties = tasks.register('generateVersionProperties', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/spider-sense.properties')
    property 'version', project.version.toString()
    property 'otelAgentVersion', rootProject.ext.otelAgentVersion
    comment = 'Generated by :spider-sense-agent:generateVersionProperties'
}

tasks.named('processResources') {
    from(generateVersionProperties)
}

def senseJar = tasks.register('senseJar', Jar) {
    group = 'build'
    description = 'The single distributable jar: OTel agent + launcher + nested server jar'

    archiveBaseName = 'spider-sense'
    archiveClassifier = ''
    archiveVersion = project.version.toString()

    // A collision between the agent's files and ours is a packaging bug, not something to
    // paper over: fail the build instead of silently picking a winner.
    duplicatesStrategy = DuplicatesStrategy.FAIL
    zip64 = true

    // The OpenTelemetry agent, verbatim: bootstrap classes at the top level, inst/**
    // (.classdata for the agent's own loader), META-INF/licenses/**, META-INF/native-image/**.
    // Only its manifest is dropped, because we write our own.
    // zipTree is called here, while the build file is read, and given a lazy
    // path: calling it inside the closure instead would reach back into this
    // script at execution time, which the configuration cache cannot store —
    // and an application attaching the jar through the plugin has senseJar in
    // its bootRun graph.
    from(zipTree(configurations.otelAgent.elements.map { it.first().asFile })) {
        exclude 'META-INF/MANIFEST.MF'
        // Signature files of a jar we repack are meaningless and break verification.
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/INDEX.LIST'
    }

    // Our launcher classes and spider-sense.properties.
    from(sourceSets.main.output)

    // The collector + UI, as a nested fat jar extracted at run time by NestedJar.
    from(configurations.server) {
        into 'spider-sense'
        rename { 'server.jar' }
    }

    // Our OpenTelemetry agent extension, extracted beside it and named by
    // otel.javaagent.extensions (design.md, "The extension").
    from(configurations.extension) {
        into 'spider-sense'
        rename { 'extension.jar' }
    }

    manifest {
        attributes(
                'Premain-Class': 'net.benelog.spidersense.launcher.SpiderSenseAgent',
                'Agent-Class': 'net.benelog.spidersense.launcher.SpiderSenseAgent',
                'Main-Class': 'net.benelog.spidersense.launcher.SpiderSenseMain',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true',
                'Implementation-Title': 'Spider Sense',
                'Implementation-Version': project.version.toString(),
                // Informational: which stock agent is packaged inside.
                'OpenTelemetry-Agent-Version': rootProject.ext.otelAgentVersion,
        )
        // The agent does read the manifest for its own version, not by name but through
        // io.opentelemetry.javaagent.tooling.AgentVersion, which is
        //   OpenTelemetryAgent.class.getPackage().getImplementationVersion()
        // and so would report OUR version in its startup line and in telemetry.distro.version.
        // A per-package manifest section keeps 2.31.1 where the agent looks, and leaves the main
        // attributes to us: a class loader resolves Package attributes from the section named
        // after the package first, and only then from the main attributes.
        attributes([
                'Implementation-Title'  : 'javaagent',
                'Implementation-Version': rootProject.ext.otelAgentVersion,
                'Implementation-Vendor' : 'OpenTelemetry',
        ], 'io/opentelemetry/javaagent/')
    }
}

tasks.named('assemble') { dependsOn senseJar }

// add(configuration, notation) rather than `senseJar senseJar`: in this script
// the name is a local variable holding the task, so the shorthand would read as
// a call on it.
artifacts {
    add('senseJar', senseJar)
}

// The plain `jar` task stays enabled and stays the launcher-only jar: it is what the test
// source set and any downstream module compile against, and it is cheap. The distributable
// is `senseJar`; only that one carries the agent manifest attributes.
jar {
    manifest {
        attributes(
                'Implementation-Title': 'Spider Sense launcher',
                'Implementation-Version': project.version.toString(),
        )
    }
}

test {
    // Unit tests only; SingleJarIT is tagged `integration` and needs the packaged jar.
    useJUnitPlatform { excludeTags 'integration' }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs SingleJarIT against the packaged spider-sense jar'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    dependsOn senseJar
    systemProperty 'spidersense.it.jar', senseJar.get().archiveFile.get().asFile.absolutePath
    systemProperty 'spidersense.it.testClasses', sourceSets.test.output.classesDirs.asPath
    // SampleApp runs an H2 statement when asked to, so the packaged extension has a database span
    // to hang a stack trace on; H2 is not on the test classes directory.
    systemProperty 'spidersense.it.sampleClasspath',
            (sourceSets.test.output.classesDirs + configurations.sampleApp).asPath
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat 'full'
    }
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }

// Published to Maven Central as net.benelog.spidersense:spider-sense, the
// coordinates docs/build-tools.md names: the single distributable jar, not the
// launcher-only `jar`, and a POM with no dependencies, because everything the
// jar needs is already inside it. `from components.java` would publish the
// wrong artifact and the launcher's (empty) dependency graph with it, so the
// artifact is named on its own.
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'spider-sense'
            artifact(senseJar)

            pom {
                name = 'spider-sense'
                description = 'Spider Sense: a local-development observability tool in one jar, attached with -javaagent, built on the OpenTelemetry Java agent.'
                url = 'https://github.com/benelog/spider-sense'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'benelog'
                        name = 'Sanghyuk Jung'
                        url = 'https://github.com/benelog'
                    }
                }
                scm {
                    url = 'https://github.com/benelog/spider-sense'
                    connection = 'scm:git:https://github.com/benelog/spider-sense.git'
                    developerConnection = 'scm:git:git@github.com:benelog/spider-sense.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'Staging'
            url = rootProject.layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Central rejects an unsigned artifact. The key arrives ASCII-armored in the
// environment, so nothing touches a keyring; without it (a local build,
// publishToMavenLocal) the signing tasks are skipped rather than failed.
signing {
    def signingKey = System.getenv('SIGNING_KEY')
    required = { signingKey != null }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, System.getenv('SIGNING_PASSWORD'))
    }
    sign publishing.publications.maven
}
