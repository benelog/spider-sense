plugins {
    id 'java'
}

description = 'Spider Sense: the OpenTelemetry agent extension that gives a slow database span a stack trace'

dependencies {
    // compileOnly and nothing else: the agent's ExtensionClassLoader rewrites these references to
    // the shaded classes inside the agent jar as it loads us, so shipping a copy of the SDK would
    // be both useless and wrong. The version is the one the packaged agent bundles.
    compileOnly "io.opentelemetry:opentelemetry-sdk-trace:${rootProject.ext.otelSdkVersion}"
    compileOnly "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:${rootProject.ext.otelSdkVersion}"

    // The same rule for the instrumentation module: the agent's own extension API (which brings
    // the ByteBuddy the advice is written against with it) and its instrumentation API, where
    // VirtualField is — the field the JDBC instrumentation fills with a prepared statement's SQL.
    // Both live inside the agent jar, shaded, and are never ours to ship. The version is the
    // packaged agent's, not the SDK's.
    compileOnly "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api:${rootProject.ext.otelAgentVersion}-alpha"
    compileOnly "io.opentelemetry.instrumentation:opentelemetry-instrumentation-api:${rootProject.ext.otelAgentVersion}"

    // The route instrumentation names Spider Silk's Route in its advice, which is inlined into the
    // application's WebRequest and resolves there; the extension ships none of it.
    compileOnly "net.benelog.spidersilk:spider-silk-core:${rootProject.ext.spiderSilkVersion}"

    testImplementation "io.opentelemetry:opentelemetry-sdk-trace:${rootProject.ext.otelSdkVersion}"
    testImplementation "io.opentelemetry:opentelemetry-sdk-logs:${rootProject.ext.otelSdkVersion}"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${rootProject.ext.otelSdkVersion}"
    testImplementation "io.opentelemetry.instrumentation:opentelemetry-instrumentation-api:${rootProject.ext.otelAgentVersion}"
    // For SchemaInstrumentationModuleTest, which checks the helper list the module hands the agent.
    testImplementation "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api:${rootProject.ext.otelAgentVersion}-alpha"
    testImplementation "com.h2database:h2:${rootProject.ext.h2Version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Spider Sense extension',
                'Implementation-Version': project.version.toString(),
        )
    }
}
