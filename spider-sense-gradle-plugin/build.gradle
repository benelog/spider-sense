plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
}

group = 'net.benelog.spidersense'
// An included build reads no gradle.properties but its own, so the release
// version is taken from the root's, the one place it is written.
version = new Properties().with { props ->
    file('../gradle.properties').withInputStream { props.load(it) }
    props.getProperty('version')
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    withJavadocJar()
}

// The plugin's default for the jar it resolves is its own version, so a plugin
// and the jar it attaches are always the same release. A manifest would not do:
// TestKit runs the plugin from the class directories, where there is no jar and
// so no Implementation-Version, and the version must be right there too.
def pluginProperties = tasks.register('pluginProperties', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/plugin-properties/spider-sense-gradle-plugin.properties')
    property 'version', project.version.toString()
    comment = 'Generated by :pluginProperties'
}

tasks.named('processResources') {
    from(pluginProperties) {
        into 'net/benelog/spidersense/gradle'
    }
}

gradlePlugin {
    plugins {
        spiderSense {
            id = 'net.benelog.spidersense'
            implementationClass = 'net.benelog.spidersense.gradle.SpiderSensePlugin'
        }
    }
}

// java-gradle-plugin generates the publications (the jar and the plugin
// marker); what is added here is the POM detail Central requires, the same
// staging directory the jar publishes to, and the signature.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'spider-sense-gradle-plugin'
            description = 'Runs an application under Spider Sense: -javaagent on bootRun and run, the spiderSense block, and the spiderSense/spiderSenseInit tasks.'
            url = 'https://github.com/benelog/spider-sense'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }
            developers {
                developer {
                    id = 'benelog'
                    name = 'Sanghyuk Jung'
                    url = 'https://github.com/benelog'
                }
            }
            scm {
                url = 'https://github.com/benelog/spider-sense'
                connection = 'scm:git:https://github.com/benelog/spider-sense.git'
                developerConnection = 'scm:git:git@github.com:benelog/spider-sense.git'
            }
        }
    }
    repositories {
        maven {
            name = 'Staging'
            url = layout.projectDirectory.dir('../build/staging-deploy')
        }
    }
}

// Central rejects an unsigned artifact. The key arrives ASCII-armored in the
// environment, so nothing touches a keyring; without it (a local build,
// publishToMavenLocal) the signing tasks are skipped rather than failed.
signing {
    def signingKey = System.getenv('SIGNING_KEY')
    required = { signingKey != null }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, System.getenv('SIGNING_PASSWORD'))
    }
    sign publishing.publications
}
