pluginManagement {
    // The Gradle plugin is an included build rather than a subproject: a plugin
    // has to be built and on the class path before the projects that apply it
    // are configured, and the examples do apply it.
    includeBuild 'spider-sense-gradle-plugin'

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'spider-sense'

include 'spider-sense-server'
include 'spider-sense-agent'
include 'spider-sense-extension'
include 'examples:silk-bookstore'
include 'examples:spring-orders'
include 'examples:servlet-warehouse'
include 'examples:batch-worker'
include 'examples:load-gen'
